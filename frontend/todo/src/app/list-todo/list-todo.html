<p>list-todo works!</p>
<div class="container">
<table   class="table"   border="1">
    <thead>
        <tr>
            <th>id</th>
            <th>description</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

    </thead>
    <tbody>
        <tr *ngFor = "let todo of todos"  >
            <td>{{ todo.id }}</td>
            <td>{{ todo.description }}</td>
            <td>{{todo.done}}</td>
            <td> {{todo.targetdate | date:'dd MMM yyyy' | uppercase }}</td>
        </tr>

    </tbody>
</table>
</div>
